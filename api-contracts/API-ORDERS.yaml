openapi: 3.0.3
info:
  title: LEAP Order Management Service - Order Processing
  description: >
    Covers instrument lookup, order submission, order lifecycle,
    order events, and fills.
  version: 1.0.0
  license:
    name: Internal use only

servers:
  - url: /v1

paths:
  /instruments:
    get:
      summary: Lists instruments
      operationId: listInstruments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Instruments returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentListResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /instruments/{instrumentId}:
    get:
      summary: Retrieves an instrument by ID
      operationId: getInstrument
      security:
        - bearerAuth: []
      parameters:
        - name: instrumentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Instrument returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}/orders:
    get:
      summary: Lists orders for an account
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Orders returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Submits a new order for an account
      operationId: submitOrder
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}:
    get:
      summary: Retrieves an order by ID
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/accept:
    post:
      summary: Accepts an order
      operationId: acceptOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/reject:
    post:
      summary: Rejects an order
      operationId: rejectOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectOrderRequest'
      responses:
        '200':
          description: Order rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/events:
    get:
      summary: Lists status events for an order
      operationId: listOrderEvents
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order events returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEventListResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/fill:
    get:
      summary: Retrieves the fill for an order
      operationId: getOrderFill
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Fill returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fill not found for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    AssetClass:
      type: string
      enum: [EQUITY, ETF, BOND, FUND, FOREX, COMMODITY, DERIVATIVE, CRYPTO]

    Currency:
      type: string
      enum: [USD, EUR]

    OrderSide:
      type: string
      enum: [BUY, SELL]

    OrderStatus:
      type: string
      enum: [SUBMITTED, ACCEPTED, REJECTED, FILLED, CANCELLED]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/Currency'

    QuoteSnapshot:
      type: object
      required: [price, quoteAt]
      properties:
        price:
          $ref: '#/components/schemas/Money'
        quoteAt:
          type: string
          format: date-time

    InstrumentResponse:
      type: object
      required: [instrumentId, market, symbol, assetClass, isTradable, quoteCurrency]
      properties:
        instrumentId:
          type: integer
          format: int64
        market:
          type: string
        symbol:
          type: string
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        isTradable:
          type: boolean
        quoteCurrency:
          $ref: '#/components/schemas/Currency'

    InstrumentListResponse:
      type: array
      items:
        $ref: '#/components/schemas/InstrumentResponse'

    CreateOrderRequest:
      type: object
      required: [instrumentId, idempotencyKey, side, requestedQuantity]
      properties:
        instrumentId:
          type: integer
          format: int64
        idempotencyKey:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/OrderSide'
        requestedQuantity:
          type: number
          format: double

    OrderResponse:
      type: object
      required: [orderId, accountId, instrumentId, idempotencyKey, side, requestedQuantity, submittedAt, currentOrderStatus]
      properties:
        orderId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        instrumentId:
          type: integer
          format: int64
        idempotencyKey:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/OrderSide'
        requestedQuantity:
          type: number
          format: double
        submittedAt:
          type: string
          format: date-time
        currentOrderStatus:
          $ref: '#/components/schemas/OrderStatus'

    OrderListResponse:
      type: array
      items:
        $ref: '#/components/schemas/OrderResponse'

    RejectOrderRequest:
      type: object
      properties:
        reasonForStatusChange:
          type: string

    OrderEventResponse:
      type: object
      required: [orderEventId, orderId, status, occurredAt]
      properties:
        orderEventId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        reasonForStatusChange:
          type: string
          nullable: true
        decisionQuote:
          allOf:
            - $ref: '#/components/schemas/QuoteSnapshot'
          nullable: true
        decisionQuoteAt:
          type: string
          format: date-time
          nullable: true
        occurredAt:
          type: string
          format: date-time

    OrderEventListResponse:
      type: array
      items:
        $ref: '#/components/schemas/OrderEventResponse'

    FillResponse:
      type: object
      required: [fillId, orderId, fillQuantity, executionPrice, executionTime]
      properties:
        fillId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        fillQuantity:
          type: number
          format: double
        executionPrice:
          $ref: '#/components/schemas/Money'
        executionTime:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

