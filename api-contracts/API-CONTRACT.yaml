        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or instrument not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}:
    get:
      summary: Retrieves an order by ID
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/accept:
    post:
      summary: Accepts an order
      operationId: acceptOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/reject:
    post:
      summary: Rejects an order
      operationId: rejectOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectOrderRequest'
      responses:
        '200':
          description: Order rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/events:
    get:
      summary: Lists status events for an order
      operationId: listOrderEvents
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order events returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEventListResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}/fill:
    get:
      summary: Retrieves the fill for an order
      operationId: getOrderFill
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Fill returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FillResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fill not found for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ClientStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE]

    AssetClass:
      type: string
      enum: [EQUITY, ETF, BOND, FUND, FOREX, COMMODITY, DERIVATIVE, CRYPTO]

    Currency:
      type: string
      enum: [USD, EUR]

    OrderSide:
      type: string
      enum: [BUY, SELL]

    OrderStatus:
      type: string
      enum: [SUBMITTED, ACCEPTED, REJECTED, FILLED, CANCELLED]

    CashMovementType:
      type: string
      enum: [DEPOSIT, WITHDRAW, FEE]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/Currency'

    QuoteSnapshot:
      type: object
      required: [price, quoteAt]
      properties:
        price:
          $ref: '#/components/schemas/Money'
        quoteAt:
          type: string
          format: date-time

    ClientResponse:
      type: object
      required: [clientId, name, email, clientStatus, clientSegment]
      properties:
        clientId:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        clientStatus:
          $ref: '#/components/schemas/ClientStatus'
        clientSegment:
          type: string

    UpdateClientRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        clientSegment:
          type: string

    UpdateClientStatusRequest:
      type: object
      required: [clientStatus]
      properties:
        clientStatus:
          $ref: '#/components/schemas/ClientStatus'

    SessionResponse:
      type: object
      required: [sessionId, clientId, createdAt, expiresAt, revoked]
      properties:
        sessionId:
          type: integer
          format: int64
        clientId:
          type: integer
          format: int64
        tokenHash:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean

    SessionListResponse:
      type: array
      items:
        $ref: '#/components/schemas/SessionResponse'

    AccountResponse:
      type: object
      required: [accountId, clientId, accountStatus, openedAt]
      properties:
        accountId:
          type: integer
          format: int64
        clientId:
          type: integer
          format: int64
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        openedAt:
          type: string
          format: date-time

    AccountListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AccountResponse'

    UpdateAccountStatusRequest:
      type: object
      required: [accountStatus]
      properties:
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'

    InstrumentResponse:
      type: object
      required: [instrumentId, market, symbol, assetClass, isTradable, quoteCurrency]
      properties:
        instrumentId:
          type: integer
          format: int64
        market:
          type: string
        symbol:
          type: string
        assetClass:
          $ref: '#/components/schemas/AssetClass'
        isTradable:
          type: boolean
        quoteCurrency:
          $ref: '#/components/schemas/Currency'

    InstrumentListResponse:
      type: array
      items:
        $ref: '#/components/schemas/InstrumentResponse'

    CreateOrderRequest:
      type: object
      required: [instrumentId, idempotencyKey, side, requestedQuantity]
      properties:
        instrumentId:
          type: integer
          format: int64
        idempotencyKey:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/OrderSide'
        requestedQuantity:
          type: number
          format: double

    OrderResponse:
      type: object
      required: [orderId, accountId, instrumentId, idempotencyKey, side, requestedQuantity, submittedAt, currentOrderStatus]
      properties:
        orderId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        instrumentId:
          type: integer
          format: int64
        idempotencyKey:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/OrderSide'
        requestedQuantity:
          type: number
          format: double
        submittedAt:
          type: string
          format: date-time
        currentOrderStatus:
          $ref: '#/components/schemas/OrderStatus'

    OrderListResponse:
      type: array
      items:
        $ref: '#/components/schemas/OrderResponse'

    RejectOrderRequest:
      type: object
      properties:
        reasonForStatusChange:
          type: string

    OrderEventResponse:
      type: object
      required: [orderEventId, orderId, status, occurredAt]
      properties:
        orderEventId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        reasonForStatusChange:
          type: string
          nullable: true
        decisionQuote:
          allOf:
            - $ref: '#/components/schemas/QuoteSnapshot'
          nullable: true
        decisionQuoteAt:
          type: string
          format: date-time
          nullable: true
        occurredAt:
          type: string
          format: date-time

    OrderEventListResponse:
      type: array
      items:
        $ref: '#/components/schemas/OrderEventResponse'

    FillResponse:
      type: object
      required: [fillId, orderId, fillQuantity, executionPrice, executionTime]
      properties:
        fillId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        fillQuantity:
          type: number
          format: double
        executionPrice:
          $ref: '#/components/schemas/Money'
        executionTime:
          type: string
          format: date-time

    CashBalanceResponse:
      type: object
      required: [accountId, currency, totalBalance, reservedBalance, updatedAt]
      properties:
        accountId:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        totalBalance:
          $ref: '#/components/schemas/Money'
        reservedBalance:
          $ref: '#/components/schemas/Money'
        updatedAt:
          type: string
          format: date-time

    CashBalanceListResponse:
      type: array
      items:
        $ref: '#/components/schemas/CashBalanceResponse'

    HoldingResponse:
      type: object
      required: [accountId, instrumentId, totalQuantity, reservedQuantity, updatedAt]
      properties:
        accountId:
          type: integer
          format: int64
        instrumentId:
          type: integer
          format: int64
        totalQuantity:
          type: number
          format: double
        reservedQuantity:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time

    HoldingListResponse:
      type: array
      items:
        $ref: '#/components/schemas/HoldingResponse'

    PortfolioResponse:
      type: object
      required: [accountId, holdings, cashBalances]
      properties:
        accountId:
          type: integer
          format: int64
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingResponse'
        cashBalances:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CashBalanceResponse'

    CashMovementResponse:
      type: object
      required: [cashMovementId, accountId, amount, movementType, currency, occurredAt]
      properties:
        cashMovementId:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        fillId:
          type: integer
          format: int64
          nullable: true
        amount:
          $ref: '#/components/schemas/Money'
        movementType:
          $ref: '#/components/schemas/CashMovementType'
        currency:
          $ref: '#/components/schemas/Currency'
        occurredAt:
          type: string
          format: date-time

    CashMovementListResponse:
      type: array
      items:
        $ref: '#/components/schemas/CashMovementResponse'

    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double

    QuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
          format: double

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    RegisterRequest:
      type: object
      required: [name, email, password, clientSegment]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        clientSegment:
          type: string

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RegisterResponse:
      type: object
      required: [client, session, token]
      properties:
        client:
          $ref: '#/components/schemas/ClientResponse'
        session:
          $ref: '#/components/schemas/SessionResponse'
        token:
          type: string
          description: Bearer token for authenticated requests

    SignInResponse:
      type: object
      required: [client, defaultAccountId, session, token]
      properties:
        client:
          $ref: '#/components/schemas/ClientResponse'
        defaultAccountId:
          type: integer
          format: int64
        session:
          $ref: '#/components/schemas/SessionResponse'
        token:
          type: string
          description: Bearer token for authenticated requests

    CurrentClientResponse:
      type: object
      required: [client, defaultAccountId]
      properties:
        client:
          $ref: '#/components/schemas/ClientResponse'
        defaultAccountId:
          type: integer
          format: int64


  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
