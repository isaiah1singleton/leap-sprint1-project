<div class="auth-page">
  <aside class="auth-story">
    <div class="brand"><img class="brand-logo" src="branding/nside-logo-dark.png" alt="Nside" width="960" height="266" /></div>
    <div><h2>Your markets.<br />Your portfolio.<br /><em>Your next move.</em></h2><p>Explore instruments, place orders and follow your holdings from one focused workspace.</p><div class="auth-features"><span>Explore markets</span><span>Track orders</span><span>Manage holdings</span></div></div>
    <p class="auth-story-foot"></p>
  </aside>
  <div class="auth-card">
    <div class="auth-theme-controls"><app-theme-toggle /></div>

    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Sign in to access your account.</p>

    @if (error) {
      <p class="error-banner">{{ error }}</p>
    }

    <label class="label" for="email">Email</label>
    <input id="email" class="input" type="email" autocomplete="username" [class.invalid]="invalid('email')"
           [(ngModel)]="email" (keyup.enter)="submit()" placeholder="you@example.com" />

    <label class="label" for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" class="input" [class.invalid]="invalid('password')"
           [(ngModel)]="password" (keyup.enter)="submit()" placeholder="Your password" />

    <button class="btn btn-primary" (click)="submit()">Sign in</button>

    <p class="auth-foot">No account yet? <a routerLink="/register">Create one</a></p>
  </div>
</div>
