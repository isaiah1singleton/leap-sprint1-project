# Firm rules for us-v1.json (503 equities on US, 12 ETFs on NYSE ARCA)
# and crypto-us.json (12 crypto instruments on CRYPTO). Edit these values as
# the firm defines fees, restrictions and exchange calendars. Unknown asset
# classes and markets fail.
trading.max-quote-age-seconds=60

trading.asset.EQUITY.supported=true
trading.asset.EQUITY.quantity-scale=0
trading.asset.EQUITY.fee-rate=0.001
trading.asset.EQUITY.tax-rate=0

trading.asset.ETF.supported=true
trading.asset.ETF.quantity-scale=0
trading.asset.ETF.fee-rate=0.001
trading.asset.ETF.tax-rate=0

trading.asset.CRYPTO.supported=true
trading.asset.CRYPTO.quantity-scale=8
trading.asset.CRYPTO.fee-rate=0.001
trading.asset.CRYPTO.tax-rate=0

# Overrides: trading.instrument.<id>.restricted=true
#            trading.instrument.<id>.quantity-scale=<number>

trading.market.US.zone=America/New_York
trading.market.US.days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
trading.market.US.open=09:30
trading.market.US.close=16:00

trading.market.NYSE\ ARCA.zone=America/New_York
trading.market.NYSE\ ARCA.days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY
trading.market.NYSE\ ARCA.open=09:30
trading.market.NYSE\ ARCA.close=16:00

trading.market.CRYPTO.zone=UTC
trading.market.CRYPTO.days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY,SUNDAY
trading.market.CRYPTO.all-day=true
