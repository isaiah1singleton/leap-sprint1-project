server.port=8082
server.address=0.0.0.0

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The tables are created with psql (Step 5.4), so Spring must not run any SQL scripts
# spring.sql.init.mode=never
#spring.sql.init.mode=always
#spring.sql.init.schema-locations=file:db/schema.sql
#spring.sql.init.data-locations=file:db/data.sql

# ---------- MyBatis ----------
# Where the XML mapper files live (used from Step 10 onwards)
mybatis.mapper-locations=classpath:mapper/*.xml

# Print the SQL executed by our mapper (uses the logging setup from Step 11 of the REST guide)
# logging.level.com.training.SpringBootDemo.mapper=debug
logging.level.org.springframework.jdbc.datasource.init=debug

# Keep the provider key on the server. Local .env files are optional.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
market.fauxnance.base-url=${FAUXNANCE_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
market.fauxnance.api-key=${FAUXNANCE_API_KEY:}

trading.execution.enabled=${ORDER_EXECUTION_ENABLED:false}
trading.execution.batch-size=25
trading.execution.initial-delay-ms=5000
trading.execution.poll-delay-ms=2000

# ---------- Audit events ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:leap-audit-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.neueda.leap
audit.kafka.topic=${AUDIT_KAFKA_TOPIC:trade.audit}
audit.outbox.poll-delay-ms=${AUDIT_OUTBOX_POLL_DELAY_MS:1000}
