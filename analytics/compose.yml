name: leap-analytics

# One-shot jobs: invoke ETL, then warehouse, sequentially with `run --rm`.
services:
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-leap}
      POSTGRES_USER: ${POSTGRES_USER:-leap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command: ["--output", "/data/batches/${BATCH_ID:-batch-001}"]
    volumes:
      - batches:/data/batches
    networks:
      - oltp
    restart: "no"
    mem_limit: 2g
    cpus: 1.0

  warehouse:
    build:
      context: .
      dockerfile: warehouse/Dockerfile
    command: ["--batch", "/data/batches/${BATCH_ID:-batch-001}", "--db", "/data/warehouse/leap_analytics.duckdb"]
    volumes:
      - batches:/data/batches:ro
      - gold:/data/warehouse
    network_mode: none
    restart: "no"
    mem_limit: 2g
    cpus: 1.0

networks:
  oltp:
    external: true
    name: ${OLTP_NETWORK:-backend_default}

volumes:
  batches:
  gold:
